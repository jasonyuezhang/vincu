# Minimal Vincu daemon + web UI deployment.
#
# Open http://localhost:6767 after `docker compose up -d`.
# For any network-reachable deployment, change VINCU_PASSWORD first.
services:
  vincu:
    image: ghcr.io/getvincu/vincu:latest
    container_name: vincu
    restart: unless-stopped
    ports:
      - "6767:6767"
    environment:
      VINCU_PASSWORD: "change-me"
      # Add DNS names you use to reach this container. IPs and localhost are
      # already allowed by default.
      # VINCU_HOSTNAMES: "vincu.example.com,.lan"
    volumes:
      # Persistent daemon state and agent credentials/config.
      - ./vincu-home:/home/vincu
      # Code visible to Vincu and the agents it launches.
      - ./workspace:/workspace
